# Case of class, interface, type-alias and enum names.
id: naming.type-case/pascal
language: TypeScript
rule:
  any:
    - kind: class_declaration
    - kind: interface_declaration
    - kind: type_alias_declaration
    - kind: enum_declaration
  has: { field: name, regex: '^[A-Z][a-zA-Z0-9]*$' }
metadata:
  harness:
    probe: naming.type-case
    family: naming
    title: Type-name case
    site: a class, interface, type alias or enum declaration
    conforming: its name uses the dominant case
    polarity: either
    check: { type: ast-grep }
    variant: pascal
    default: true
    statement: 'Classes, interfaces, type aliases and enums are PascalCase (OrderItem).'
    fixText: 'Rename the type to PascalCase.'
---
id: naming.type-case/other
language: TypeScript
rule:
  any:
    - kind: class_declaration
    - kind: interface_declaration
    - kind: type_alias_declaration
    - kind: enum_declaration
  has: { field: name, regex: '^(?:[a-z_$]|[A-Z][A-Z0-9]*_)' }
metadata:
  harness:
    probe: naming.type-case
    variant: other
