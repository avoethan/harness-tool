# await inside loops (informational: sequential awaits are sometimes intended).
id: async.await-in-loop/in-loop
language: TypeScript
rule:
  kind: await_expression
  inside:
    stopBy:
      any: [ { kind: function_declaration }, { kind: arrow_function }, { kind: function_expression }, { kind: method_definition } ]
    any: [ { kind: for_statement }, { kind: for_in_statement }, { kind: while_statement }, { kind: do_statement } ]
metadata:
  harness:
    probe: async.await-in-loop
    family: async
    title: await inside loops
    site: an await expression
    conforming: informational (inside a loop body or not)
    polarity: either
    record: false
    languages: [TypeScript, Tsx, JavaScript]
    check: { type: ast-grep }
    variant: in-loop
---
id: async.await-in-loop/outside
language: TypeScript
rule:
  kind: await_expression
  not:
    inside:
      stopBy:
        any: [ { kind: function_declaration }, { kind: arrow_function }, { kind: function_expression }, { kind: method_definition } ]
      any: [ { kind: for_statement }, { kind: for_in_statement }, { kind: while_statement }, { kind: do_statement } ]
metadata:
  harness:
    probe: async.await-in-loop
    variant: outside
